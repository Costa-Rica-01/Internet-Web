
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Internet Connection - Buscador</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
    }
    
    /* Google-style Multi-color letters */
    .c-blue { color: #4285F4; }
    .c-red { color: #EA4335; }
    .c-yellow { color: #FBBC05; }
    .c-green { color: #34A853; }

    /* Glowing search bar on focus */
    .search-bar-wrap {
      transition: all 0.25s ease-in-out;
      box-shadow: 0 1px 6px rgba(32,33,36,0.18);
    }
    .search-bar-wrap:focus-within, .search-bar-wrap:hover {
      box-shadow: 0 2px 12px rgba(32,33,36,0.30);
      border-color: transparent;
    }

    /* Tab indicator styles */
    .tab-btn.active {
      border-bottom: 3px solid #4285F4;
      color: #4285F4;
      font-weight: 600;
    }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col justify-between">

  <!-- Header / Navigation Bar -->
  <header class="w-full py-4 px-6 flex justify-between items-center bg-white border-b border-slate-200">
    <div class="text-sm font-medium text-slate-500">
      Motor de Búsqueda Personalizado
    </div>
    <div class="flex items-center space-x-4">
      <a href="https://www.google.com" target="_blank" class="text-xs sm:text-sm text-slate-600 hover:text-blue-600 transition">Google Web</a>
      
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="w-full max-w-5xl mx-auto px-4 py-8 flex-1 flex flex-col items-center">

    <!-- Vibrant Logo Section -->
    <div class="logo text-4xl sm:text-6xl font-extrabold tracking-tight my-6 select-none text-center">
      <span class="c-blue">I</span><span class="c-red">n</span><span class="c-yellow">t</span><span class="c-blue">e</span><span class="c-green">r</span><span class="c-red">n</span><span class="c-blue">e</span><span class="c-yellow">t</span>
      <span class="px-1 sm:px-2">&nbsp;</span>
      <span class="c-blue">C</span><span class="c-red">o</span><span class="c-yellow">n</span><span class="c-blue">n</span><span class="c-green">e</span><span class="c-red">c</span><span class="c-yellow">t</span><span class="c-blue">i</span><span class="c-green">o</span><span class="c-red">n</span>
    </div>

    <!-- Engine Selector Tabs -->
    <div class="flex space-x-2 sm:space-x-6 mb-6 text-sm sm:text-base border-b border-slate-200 w-full max-w-2xl justify-center">
      <button onclick="switchEngine('google')" id="tab-google" class="tab-btn active pb-2 px-3 transition">Google</button>
     
      <button onclick="switchEngine('bing')" id="tab-bing" class="tab-btn pb-2 px-3 text-slate-500 transition">Bing</button>
      <button onclick="switchEngine('wikipedia')" id="tab-wikipedia" class="tab-btn pb-2 px-3 text-slate-500 transition">Wikipedia</button>
    </div>

    <!-- Search Form -->
    <form id="searchForm" class="w-full max-w-2xl">
      <div class="search-bar-wrap bg-white rounded-full border border-slate-300 flex items-center px-4 py-3">
        <!-- Search Icon -->
        <svg class="w-5 h-5 text-slate-400 mr-3 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>

        <!-- Input -->
        <input 
          id="searchQuery" 
          type="text" 
          class="w-full bg-transparent outline-none text-base sm:text-lg text-slate-800 placeholder-slate-400" 
          placeholder="Busca en Internet..." 
          required 
          autofocus
        />

        <!-- Clear Input Button -->
        <button type="button" id="clearBtn" onclick="clearSearch()" class="hidden text-slate-400 hover:text-slate-600 mr-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>

        <!-- Submit Button -->
        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white rounded-full p-2 transition shrink-0">
          <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
          </svg>
        </button>
      </div>
    </form>

    <!-- Fallback / Warning Banner -->
    <div id="fallbackNotice" class="hidden w-full max-w-2xl mt-4 bg-amber-50 border border-amber-200 rounded-lg p-3 text-xs sm:text-sm text-amber-800 flex justify-between items-center">
      <span>los resultados cargan en la misma pagina</span>
      <a id="externalLink" href="#" target="_blank" class="ml-2 font-semibold text-blue-600 hover:underline shrink-0">Abrir en pestaña nueva &rarr;</a>
    </div>

    <!-- Results Display Container -->
    <div id="resultContainer" class="w-full mt-6 hidden flex-1">
      <iframe 
        id="resultsIframe" 
        class="w-full h-[650px] rounded-xl border border-slate-200 shadow-md bg-white"
        src="" 
        title="Resultados de Búsqueda">
      </iframe>
    </div>

  </main>

  <!-- Footer -->
  <footer class="w-full bg-slate-100 border-t border-slate-200 py-4 text-center text-xs text-slate-500">
    <p>© Internet Connection - Plantilla de interfaz de búsqueda moderna y responsiva.</p>
  </footer>

  <!-- Search Logic Script -->
  <script>
    let activeEngine = 'google';
    const form = document.getElementById('searchForm');
    const input = document.getElementById('searchQuery');
    const clearBtn = document.getElementById('clearBtn');
    const iframe = document.getElementById('resultsIframe');
    const resultContainer = document.getElementById('resultContainer');
    const fallbackNotice = document.getElementById('fallbackNotice');
    const externalLink = document.getElementById('externalLink');

    // Engine URL builders
    const engines = {
      google: (q) => `https://www.google.com/search?igu=1&q=${q}`,
      duckduckgo: (q) => `https://duckduckgo.com/?q=${q}`,
      bing: (q) => `https://www.bing.com/search?q=${q}`,
      wikipedia: (q) => `https://es.wikipedia.org/wiki/Especial:Buscar?search=${q}`
    };

    // Show/hide clear button based on text
    input.addEventListener('input', () => {
      if (input.value.length > 0) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }
    });

    function clearSearch() {
      input.value = '';
      clearBtn.classList.add('hidden');
      input.focus();
    }

    // Switch Search Engine
    function switchEngine(engine) {
      activeEngine = engine;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('active');
        btn.classList.add('text-slate-500');
      });

      const currentTab = document.getElementById(`tab-${engine}`);
      currentTab.classList.add('active');
      currentTab.classList.remove('text-slate-500');

      // Re-trigger search if query exists
      if (input.value.trim() !== '') {
        performSearch();
      }
    }

    // Form Submission Handler
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      performSearch();
    });

    function performSearch() {
      const query = encodeURIComponent(input.value.trim());
      if (!query) return;

      const targetUrl = engines[activeEngine](query);
      
      // Update iframe source
      iframe.src = targetUrl;
      resultContainer.classList.remove('hidden');
      
      // Update fallback external link
      externalLink.href = targetUrl;
      fallbackNotice.classList.remove('hidden');

      // Scroll smoothly to results on mobile
      resultContainer.scrollIntoView({ behavior: 'smooth' });
    }
  </script>
</body>
</html>

<footer class="erick-footer">
  <div class="footer-colors"></div>
  <h2>Erick <span>Programador</span></h2>
  
  <small>©Internet-Web</small>
</footer>
